name: Sumire Dev Device Deploy

on:
  push:
    branches:
      - 'main'

permissions:
  contents: read

concurrency:
  group: sumire-dev-device-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.repository == 'YuyaIsh/JapaneseKeyboard' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    name: Publish Sumire Dev prerelease
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DEV_TAG: 1.7.119-dev.${{ github.run_number }}
    runs-on: [self-hosted, linux, x64, sumire-device]
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Add Android SDK tools to PATH
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$sdk_root" ]]; then
            echo "::error::ANDROID_SDK_ROOT or ANDROID_HOME is not configured on the runner."
            exit 1
          fi
          cmake_bin="$(find "$sdk_root/cmake" -mindepth 2 -maxdepth 2 -type d -name bin -print -quit)"
          if [[ -z "$cmake_bin" ]]; then
            echo "::error::No Android SDK CMake installation was found under $sdk_root/cmake."
            exit 1
          fi
          {
            echo "$sdk_root/platform-tools"
            echo "$sdk_root/cmdline-tools/latest/bin"
            echo "$cmake_bin"
          } >> "$GITHUB_PATH"

      - name: Verify persistent debug signing key
        shell: bash
        run: |
          set -euo pipefail
          keystore="$HOME/.android/debug.keystore"
          test -f "$keystore" || { echo "::error::Existing debug keystore missing: $keystore; refusing to generate a new identity."; exit 1; }
          echo "Debug keystore: $keystore (user: $(id -un))"
          fingerprint="$(keytool -exportcert -keystore "$keystore" -storepass android -alias androiddebugkey | sha256sum | cut -d ' ' -f 1)"
          test "$fingerprint" = "ad2b22c9b9847ab7070bc8bd31328996044774f57956aa1c1700e0474395e107"
          echo "Debug certificate SHA-256: $fingerprint"
          if gh release view "$DEV_TAG" >/dev/null 2>&1; then
            echo "::error::Release $DEV_TAG already exists; refusing to republish. Push a new commit."
            exit 1
          fi

      - name: Build fullStandardDebug
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: >-
          ./gradlew :app:assembleFullStandardDebug
          -PsumireDevBuild=${{ github.run_number }}
          --stacktrace
          --no-daemon
          --max-workers=1

      - name: Verify APK and publish prerelease
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/fullStandard/debug/app-full-standard-debug.apk"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          build_tools="$(find "$sdk_root/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          badging="$("$build_tools/aapt" dump badging "$apk")"
          printf '%s\n' "${badging%%$'\n'*}"
          expected_code="$((1000000 + GITHUB_RUN_NUMBER))"
          [[ "$badging" == *"package: name='com.kazumaproject.markdownhelperkeyboard.dev' versionCode='$expected_code' versionName='$DEV_TAG'"* ]]
          certificate="$("$build_tools/apksigner" verify --print-certs "$apk")"
          echo "$certificate"
          [[ "$certificate" == *"Signer #1 certificate SHA-256 digest: ad2b22c9b9847ab7070bc8bd31328996044774f57956aa1c1700e0474395e107"* ]]
          gh release create "$DEV_TAG" "$apk" \
            --target "$GITHUB_SHA" --prerelease --title "$DEV_TAG" \
            --notes "Sumire Dev (.dev), fullStandardDebug. versionCode=$expected_code; versionName=$DEV_TAG. Commit: $GITHUB_SHA. Obtainium: add https://github.com/YuyaIsh/JapaneseKeyboard and enable pre-releases."

      - name: Verify Android tooling and exactly one device
        if: ${{ vars.SUMIRE_ADB_INSTALL == 'true' }}
        id: device
        shell: bash
        run: |
          set -euo pipefail
          command -v adb
          adb version
          command -v cmake
          adb start-server

          mapfile -t adb_devices < <(
            adb devices | awk 'NR > 1 && NF >= 2 { print $1 "\t" $2 }'
          )
          if (( ${#adb_devices[@]} == 0 )); then
            echo "No ADB device connected; prerelease is available through Obtainium."
            exit 0
          fi
          if (( ${#adb_devices[@]} != 1 )); then
            echo "::error::Expected exactly one connected ADB device, found ${#adb_devices[@]}."
            adb devices -l
            exit 1
          fi

          IFS=$'\t' read -r serial state <<< "${adb_devices[0]}"
          if [[ "$state" != "device" ]]; then
            echo "::error::Expected one ready ADB device, but $serial is in state $state."
            adb devices -l
            exit 1
          fi
          echo "serial=$serial" >> "$GITHUB_OUTPUT"

      - name: Install Sumire Dev APK
        if: ${{ steps.device.outputs.serial != '' }}
        env:
          ADB_SERIAL: ${{ steps.device.outputs.serial }}
          DEV_APPLICATION_ID: com.kazumaproject.markdownhelperkeyboard.dev
        shell: bash
        run: |
          set -euo pipefail
          apk_path="app/build/outputs/apk/fullStandard/debug/app-full-standard-debug.apk"
          if [[ ! -f "$apk_path" ]]; then
            echo "::error::Expected APK was not produced: $apk_path"
            find app/build/outputs/apk -type f -name '*.apk' -print || true
            exit 1
          fi
          adb -s "$ADB_SERIAL" install -r "$apk_path"
          adb -s "$ADB_SERIAL" shell pm path "$DEV_APPLICATION_ID"
